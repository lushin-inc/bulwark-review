<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulwark — Sales Progress Review</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --stable:#21245C;
  --fresh:#00ADED;
  --energetic:#0045C2;
  --passionate:#E34554;
  --fireball:#F05A28;
  --limitless:#FAB040;
  --gray:#EDEDED;
  --white:#FFFFFF;
  --body:#333333;
  --subtle:#666666;
  --font:'Poppins',Arial,sans-serif;
  --nav:260px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;font-family:var(--font);font-weight:400;color:var(--body);
  background:var(--white);line-height:1.6;-webkit-font-smoothing:antialiased;
}
a{color:inherit;}
:focus-visible{outline:3px solid var(--fresh);outline-offset:3px;}

/* ---------- side nav ---------- */
.nav{
  position:fixed;top:0;left:0;width:var(--nav);height:100vh;
  background:var(--stable);padding:38px 0;overflow-y:auto;z-index:20;
}
.brand{padding:0 30px 30px;}
.brand .mark{
  font-weight:600;font-size:19px;color:var(--white);letter-spacing:-.01em;margin:0;
}
.brand .mark span{color:var(--fresh);}
.nav a{
  display:block;padding:14px 30px;text-decoration:none;color:rgba(255,255,255,.72);
  font-weight:400;font-size:14px;border-left:4px solid transparent;
}
.nav a:hover{color:var(--white);background:rgba(255,255,255,.06);}
.nav a.on{color:var(--white);font-weight:500;border-left-color:var(--fresh);background:rgba(255,255,255,.08);}

/* ---------- main ---------- */
.main{margin-left:var(--nav);padding:64px 56px 96px;max-width:1180px;}

.eyebrow{
  font-weight:400;font-size:14px;color:var(--subtle);margin:0 0 4px;
}
h1{font-weight:500;font-size:26px;line-height:1.2;color:var(--stable);margin:0 0 44px;}

/* ---------- hub tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.tile{
  position:relative;display:flex;flex-direction:column;justify-content:space-between;
  min-height:430px;padding:34px;border-radius:20px;text-decoration:none;
  color:var(--white);border:0;text-align:left;font-family:var(--font);cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease;
}
.tile:hover{transform:translateY(-5px);}
.tile .ico{
  width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
}
.tile .ico svg{width:28px;height:28px;stroke:var(--white);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.tile .ctx{font-weight:200;font-size:15px;opacity:.85;margin:0 0 6px;}
.tile .ttl{font-weight:600;font-size:34px;line-height:1.12;margin:0;letter-spacing:-.02em;}

.g1{background:radial-gradient(circle at 30% 20%,#2F3480,var(--stable) 70%);box-shadow:0 18px 40px -14px rgba(33,36,92,.55);}
.g2{background:radial-gradient(circle at 30% 20%,var(--fresh),var(--energetic) 75%);box-shadow:0 18px 40px -14px rgba(0,69,194,.5);}
.g3{background:linear-gradient(140deg,var(--passionate),var(--fireball));box-shadow:0 18px 40px -14px rgba(227,69,84,.5);}
.g4{background:linear-gradient(140deg,var(--fireball),var(--limitless));box-shadow:0 18px 40px -14px rgba(240,90,40,.45);}
.g5{background:radial-gradient(circle at 30% 20%,var(--stable),#000000 80%);box-shadow:0 18px 40px -14px rgba(0,0,0,.5);}

/* ---------- section view ---------- */
.shead{border-radius:20px;padding:40px 44px;color:var(--white);margin:0 0 44px;}
.shead .ctx{font-weight:200;font-size:16px;opacity:.85;margin:0 0 6px;}
.shead h2{font-weight:600;font-size:36px;line-height:1.1;margin:0;letter-spacing:-.02em;}

.block{margin-bottom:40px;}
.block:last-child{margin-bottom:0;}
.block h3{
  font-weight:500;font-size:17px;color:var(--stable);margin:0 0 14px;
}
.block > ul{margin:0;padding-left:22px;}
.block > ul > li{margin-bottom:12px;font-size:15px;}
.block > ul > li:last-child{margin-bottom:0;}
.block ul ul{margin:10px 0 0;padding-left:22px;}
.block ul ul li{margin-bottom:7px;font-size:14px;color:var(--body);}
.lead{font-weight:500;color:var(--stable);}

.status{
  display:grid;grid-template-columns:repeat(2,1fr);gap:16px;
}
.card{background:var(--gray);border-radius:14px;padding:22px 24px;}
.card .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px;}
.card .nm{font-weight:600;font-size:17px;color:var(--stable);margin:0;}
.card .mk{font-weight:500;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--white);padding:4px 11px;border-radius:999px;white-space:nowrap;}
.mk-move{background:var(--fresh);}
.mk-part{background:var(--limitless);}
.mk-att{background:var(--fireball);}
.card ul{margin:0;padding-left:20px;}
.card li{font-size:14px;margin-bottom:7px;}
.card li:last-child{margin-bottom:0;}

.split{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;}
.own{border-radius:14px;padding:26px 28px;background:var(--gray);}
.own h3{margin-top:0;}

@media (max-width:1040px){
  .tiles{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:860px){
  :root{--nav:0px;}
  .nav{position:static;width:100%;height:auto;padding:24px 0 10px;display:block;}
  .brand{padding:0 22px 14px;}
  .nav a{display:inline-block;padding:9px 16px;border-left:0;border-bottom:3px solid transparent;font-size:13px;}
  .nav a.on{border-left:0;border-bottom-color:var(--fresh);background:transparent;}
  .main{margin-left:0;padding:34px 22px 72px;}
  .tiles{grid-template-columns:1fr;}
  .tile{min-height:300px;padding:28px;}
  .tile .ttl{font-size:28px;}
  .shead{padding:28px 26px;}
  .shead h2{font-size:27px;}
  .status,.split{grid-template-columns:1fr;}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  .tile{transition:none;}
  .tile:hover{transform:none;}
}
</style>
</head>
<body>

<nav class="nav" id="nav">
  <div class="brand"><p class="mark">Bulwark <span>·</span> Lushin</p></div>
</nav>

<main class="main" id="main"></main>

<script>
/* =====================================================================
   ADD OR EDIT A SECTION: add one entry to this array. Nothing else changes.
   id       = hash route (#id)
   title    = big section name (plain label, no headlines)
   grad     = g1 | g2 | g3 | g4 | g5
   icon     = key from ICONS below
   blocks   = content; each block is {h: optional heading, ul: [...]}
              a list item can be a string, or {lead:"...", ul:[...]} to nest
   ===================================================================== */
const SECTIONS = [
  {
    id:'standing', title:'Where We Stand', grad:'g1', icon:'gauge',
    status:[
      {nm:'Strategy', mk:'Moving', cls:'mk-move', ul:[
        'Priorities are clearer than they have been: strengthen current customers, cultivate new accounts, sharpen qualifying and closing.',
        'One thing to settle: the company revenue target has been stated two different ways. The sales plan needs one number to build from.'
      ]},
      {nm:'Staff', mk:'Needs attention', cls:'mk-att', ul:[
        'One seller is performing well above baseline and carrying the year.',
        'Two are below baseline for different reasons, and neither reason has been acted on.',
        'The added sales hire has been on hold since the start of the year with no defined trigger to release it.'
      ]},
      {nm:'Skills', mk:'Partly landing', cls:'mk-part', ul:[
        'Qualification is showing up in real conversations. Pain, budget and decision questions are being asked.',
        'Closing is not landing. It is the same gap it was at the start of this window.'
      ]},
      {nm:'Structure', mk:'Needs attention', cls:'mk-att', ul:[
        'The pipeline, the playbook, the quote criteria and the activity tracking all exist and all work.',
        'None of them currently has a consequence attached, so the design does not change behavior.'
      ]}
    ]
  },
  {
    id:'progress', title:'What Moved', grad:'g2', icon:'rise',
    blocks:[
      {ul:[
        {lead:'One seller cleared baseline by a wide margin', ul:[
          'Nearly double the monthly baseline, for the second time this year.',
          'On pace to finish above the annual number.'
        ]},
        {lead:'The pipeline was rebuilt on the five milestone stages', ul:[
          'Copper restructured within two weeks of the in-person session.',
          'Old stages that were killing deals were removed.'
        ]},
        {lead:'The whole team worked a full day in person', ul:[
          'Pipeline audit, prospecting practice, pain discovery, closing and PO practice.',
          'Every rep left with a named gap to work on.'
        ]},
        {lead:'Quote criteria are in active use', ul:[
          'Printed checklists are being run before quotes go out.'
        ]},
        {lead:'Conversations can now be reviewed instead of recalled', ul:[
          'Meeting capture is in place for both virtual and in-person calls.',
          'This is what makes real coaching possible.'
        ]},
        {lead:'Coaching expanded past the sales manager', ul:[
          'Direct sessions now open with the general manager and with reps individually.'
        ]}
      ]}
    ]
  },
  {
    id:'blocking', title:"What's Blocking", grad:'g3', icon:'block',
    blocks:[
      {ul:[
        {lead:'Deals stop after the rough draft goes out', ul:[
          'Most have no scheduled next step attached.',
          'Momentum depends on the customer coming back on their own.'
        ]},
        {lead:'"We will reach out when we are ready" is being accepted as progress', ul:[
          'It is not a commitment, and it is where most of the pipeline is sitting.',
          'This is the single biggest constraint on revenue right now.'
        ]},
        {lead:'Committed weekly activity has been missed three checks in a row', ul:[
          'The tracking works. The follow-through does not.',
          'Nothing currently changes when a commitment is missed.'
        ]},
        {lead:'Live prospecting has been replaced by email and messaging', ul:[
          'Those channels are easier, and they are not producing meetings.',
          'Calls and walk-ins are close to zero for part of the team.'
        ]},
        {lead:'Two roster decisions have been open for months', ul:[
          'Both are holding up territory planning and the added hire.'
        ]},
        {lead:'Two of the three stated priorities have no scoreboard', ul:[
          'Repeat orders and new-account growth are not currently measured.'
        ]}
      ]}
    ]
  },
  {
    id:'plan', title:'The Plan', grad:'g4', icon:'target',
    blocks:[
      {h:'The goal, narrowed to one thing', ul:[
        'Every open deal past rough draft has a scheduled next meeting, with a named decision maker, on the calendar.',
        'Three live closing conversations reviewed every month from recordings.'
      ]},
      {h:'How we will know it is working', ul:[
        'The rough-draft stage stops accumulating deals.',
        'Close rate on quoted work rises while quote volume falls.',
        'Both numbers come straight off the Copper export. No new reporting to build.'
      ]},
      {h:'Training next — sales team', ul:[
        {lead:'Getting Deals Across the Finish Line', ul:[
          'Run against live open deals, not generic scenarios.'
        ]},
        {lead:'Avoiding Think It Overs', ul:[
          'Built specifically around the "we will reach out" response.'
        ]}
      ]},
      {h:'Training next — sales leadership', ul:[
        {lead:'Coaching Clinic', ul:[
          'Turning the tools already in place into inspection and follow-through.'
        ]}
      ]}
    ]
  },
  {
    id:'commitments', title:'Who Owns What', grad:'g5', icon:'hands',
    split:[
      {h:'Bulwark owns', ul:[
        'Put a date on the two open roster decisions.',
        'Define the revenue trigger that releases the added sales hire.',
        'Send three recorded closing conversations before the next session.',
        'Attach a consequence to missed weekly activity.',
        'Pick the one company revenue number the sales plan builds from.'
      ]},
      {h:'Lushin owns', ul:[
        'Run both closing sessions against live open deals.',
        'Review the three recordings and come back with specific coaching, not general feedback.',
        'Build the repeat-order and new-account measures off the Copper export.',
        'Open every session with your agenda before ours.'
      ]}
    ]
  }
];

const ICONS = {
  gauge:'<path d="M12 21a9 9 0 1 1 9-9"/><path d="M12 12l4.5-4.5"/><circle cx="12" cy="12" r="1.4"/>',
  rise:'<path d="M3 17l6-6 4 4 8-8"/><path d="M21 7v5h-5"/>',
  block:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',
  hands:'<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 12V4.5a1.5 1.5 0 0 1 3 0V12"/><path d="M14 12V6.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6v-2a1.5 1.5 0 0 1 3 0"/>'
};

const nav = document.getElementById('nav');
const main = document.getElementById('main');

/* build side nav — Home first */
const links = [{id:'home',title:'Home'}].concat(SECTIONS.map(s=>({id:s.id,title:s.title})));
links.forEach(l=>{
  const a = document.createElement('a');
  a.href = '#' + l.id;
  a.textContent = l.title;
  a.dataset.id = l.id;
  nav.appendChild(a);
});

function svg(key){
  return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[key] + '</svg>';
}

function renderList(items){
  return '<ul>' + items.map(it=>{
    if (typeof it === 'string') return '<li>' + it + '</li>';
    return '<li><span class="lead">' + it.lead + '</span>' +
           (it.ul ? renderList(it.ul) : '') + '</li>';
  }).join('') + '</ul>';
}

function renderHome(){
  return '<p class="eyebrow">Bulwark Safety Systems</p>' +
    '<h1>Sales Progress Review</h1>' +
    '<div class="tiles">' + SECTIONS.map(s=>
      '<a class="tile ' + s.grad + '" href="#' + s.id + '">' +
        '<div class="ico">' + svg(s.icon) + '</div>' +
        '<div><p class="ctx">Bulwark</p><p class="ttl">' + s.title + '</p></div>' +
      '</a>').join('') +
    '</div>';
}

function renderSection(s){
  let html = '<div class="shead ' + s.grad + '">' +
    '<p class="ctx">Bulwark</p><h2>' + s.title + '</h2></div>';

  if (s.status){
    html += '<div class="status">' + s.status.map(c=>
      '<div class="card"><div class="top"><p class="nm">' + c.nm + '</p>' +
      '<span class="mk ' + c.cls + '">' + c.mk + '</span></div>' +
      '<ul>' + c.ul.map(x=>'<li>' + x + '</li>').join('') + '</ul></div>').join('') +
    '</div>';
  }
  if (s.blocks){
    html += s.blocks.map(b=>'<div class="block">' +
      (b.h ? '<h3>' + b.h + '</h3>' : '') + renderList(b.ul) + '</div>').join('');
  }
  if (s.split){
    html += '<div class="split">' + s.split.map(o=>
      '<div class="own"><h3>' + o.h + '</h3>' +
      '<ul>' + o.ul.map(x=>'<li>' + x + '</li>').join('') + '</ul></div>').join('') +
    '</div>';
  }
  return html;
}

function route(){
  const id = (location.hash || '#home').slice(1);
  const s = SECTIONS.find(x=>x.id === id);
  main.innerHTML = s ? renderSection(s) : renderHome();
  nav.querySelectorAll('a').forEach(a=>
    a.classList.toggle('on', a.dataset.id === (s ? id : 'home')));
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
